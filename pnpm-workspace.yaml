packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10.x 起，overrides / patchedDependencies / onlyBuiltDependencies
# 不再从 package.json 的 "pnpm" 字段读取，统一迁移到这里。
onlyBuiltDependencies:
  - esbuild

overrides:
  '@tiptap/core': 3.22.2
  '@tiptap/suggestion': 3.22.2
  lodash-es: ^4.18.1
  nanoid: ^3.3.11
  react-error-overlay: 6.0.9

patchedDependencies:
  # electron-builder 26.x pnpm 依赖收集器 bug：pnpm list 树同名包只展开一处，
  # 导致 electron-screenshots -> debug -> ms 等传递依赖漏进 app.asar（运行时 Cannot find module 'ms'）。
  # 补丁让收集器以 package.json 声明为准补全依赖图。
  app-builder-lib@26.8.1: patches/app-builder-lib@26.8.1.patch
