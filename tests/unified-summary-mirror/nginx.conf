server {
    listen 80;
    root /usr/share/nginx/html;
    location /summary/ {
        # Docker's embedded DNS, re-resolved on a short TTL. nginx otherwise resolves
        # an upstream named in proxy_pass once at startup, so restarting the API
        # container (which usually changes its IP) would leave this serving 502s until
        # the web container was restarted too. The variable is what forces the runtime
        # lookup.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream summary-versioning-unified-api-1:8080;
        # A proxy_pass whose target contains a variable does NOT get nginx's automatic
        # "replace the location prefix with the target URI" treatment, so strip the
        # /summary prefix explicitly or the API sees /summary/api/... and 404s.
        rewrite ^/summary/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
