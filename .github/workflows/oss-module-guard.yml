name: OSS Module Guard

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: Block removed enterprise modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Guard removed enterprise modules
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          changed_files="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --paginate \
            --jq '.[] | [.filename, .status] | @tsv' > "${changed_files}"

          blocked_paths="$(mktemp)"
          awk -F '\t' '
            $1 ~ /^packages\/(dmloop|dmpersonal)(\/|$)/ ||
            $1 ~ /^apps\/web\/e2e-kit\/(case-specs|reports|screenshots|tests)\/.*(loop|personal)/ {
              print $1
            }
          ' "${changed_files}" > "${blocked_paths}"

          if [[ -s "${blocked_paths}" ]]; then
            echo "::error::Loop/Personal have been moved out of the OSS repository. Submit these changes to the enterprise module repository instead."
            cat "${blocked_paths}"
            exit 1
          fi

          blocked_refs="$(mktemp)"
          while IFS=$'\t' read -r file status; do
            [[ "${status}" == "removed" ]] && continue
            [[ "${file}" == ".github/workflows/oss-module-guard.yml" ]] && continue
            [[ -f "${file}" ]] || continue

            case "${file}" in
              *.ts|*.tsx|*.js|*.jsx|*.mjs|*.cjs|*.json|*.yaml|*.yml|pnpm-lock.yaml|package.json|Dockerfile*)
                if grep -nHE "@(octo|dmwork)/(loop|personal)(/|['\"[:space:]]|$)" "${file}" >> "${blocked_refs}"; then
                  true
                fi
                ;;
            esac
          done < "${changed_files}"

          if [[ -s "${blocked_refs}" ]]; then
            echo "::error::Open-source code must not reintroduce Loop/Personal package imports. Submit these changes to the enterprise module repository instead."
            cat "${blocked_refs}"
            exit 1
          fi
