name: OSS Module Guard

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: Block removed enterprise modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Guard removed enterprise modules
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          changed_files="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --paginate \
            --jq '.[] | [.filename, .status, (.previous_filename // "")] | @tsv' > "${changed_files}"

          guard_awk="$(mktemp)"
          # shellcheck disable=SC2016
          printf '%s\n' \
            'function removed_module_path(path) {' \
            '  return path ~ /^packages\/(dmloop|dmpersonal|dmworkdrive|docs)(\/|$)/' \
            '}' \
            'function removed_module_e2e_path(path) {' \
            '  return path ~ /^apps\/web\/e2e-kit\/(case-specs|reports|screenshots|tests)\/(loop|personal|drive|doc|docs)([\/_.-]|$)/ ||' \
            '    path ~ /^apps\/web\/e2e-kit\/(case-specs|reports|screenshots|tests)\/.*[\/_.-](loop|personal|drive|doc|docs)([\/_.-]|$)/' \
            '}' \
            '$2 != "removed" && (removed_module_path($1) || removed_module_e2e_path($1)) { print $1; next }' \
            '$2 == "renamed" && (removed_module_path($3) || removed_module_e2e_path($3)) { print $3 " -> " $1; next }' \
            > "${guard_awk}"

          guard_fixture="$(mktemp)"
          printf '%s\n' \
            $'apps/web/e2e-kit/tests/doc/foo.spec.ts\tadded' \
            $'apps/web/e2e-kit/tests/docs.spec.ts\tadded' \
            $'apps/web/e2e-kit/tests/loop/foo.spec.ts\tadded' \
            $'apps/web/e2e-kit/case-specs/docs-login.md\tadded' \
            > "${guard_fixture}"
          fixture_hits="$(awk -F '\t' -f "${guard_awk}" "${guard_fixture}")"
          fixture_count="$(printf '%s\n' "${fixture_hits}" | grep -c . || true)"
          if [[ "${fixture_count}" -ne 4 ]]; then
            echo "::error::OSS module guard fixture coverage failed."
            printf '%s\n' "${fixture_hits}"
            exit 1
          fi

          blocked_paths="$(mktemp)"
          awk -F '\t' -f "${guard_awk}" "${changed_files}" > "${blocked_paths}"

          if [[ -s "${blocked_paths}" ]]; then
            echo "::error::Loop/Personal/Drive/Docs have been moved out of the OSS repository. Submit these changes to the enterprise module repository instead."
            cat "${blocked_paths}"
            exit 1
          fi

          blocked_refs="$(mktemp)"
          while IFS=$'\t' read -r file status _previous_file; do
            [[ "${status}" == "removed" ]] && continue
            [[ "${file}" == ".github/workflows/oss-module-guard.yml" ]] && continue
            [[ -f "${file}" ]] || continue

            case "${file}" in
              *.ts|*.tsx|*.mts|*.cts|*.js|*.jsx|*.mjs|*.cjs|*.css|*.scss|*.less|*.json|*.yaml|*.yml|Dockerfile*)
                if grep -nHE "@(octo|dmwork)/(loop|personal|drive|docs)(/|['\"[:space:]]|$)" "${file}" >> "${blocked_refs}"; then
                  true
                fi
                ;;
            esac
          done < "${changed_files}"

          if [[ -s "${blocked_refs}" ]]; then
            echo "::error::Open-source code must not reintroduce Loop/Personal/Drive/Docs package imports. Submit these changes to the enterprise module repository instead."
            cat "${blocked_refs}"
            exit 1
          fi
