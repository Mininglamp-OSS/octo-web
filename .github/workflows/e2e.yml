# e2e PR gate: build once, run the full Playwright suite, junit 后处理判 business vs visual fail
# 姿势沿用 e2e-kit v0.4 依据 (docs/methodology/module-organization.md tag 层次):
#   - 全量业务 case 阻断 (fail block PR)
#   - @visual 视觉基线 (visual-only fail 不 block, 由 baseline update workflow 刷新)

name: e2e

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # e2e=true when at least one changed file matches any positive path below.
      # Positive filter uses dorny's default 'some' quantifier (predicate-quantifier
      # intentionally unset): semantics = "some changed file matches some pattern".
      # Do NOT copy ci.yml's 'every' quantifier — that is for negation patterns only;
      # using 'every' here would drop mixed PRs (e.g. apps/web/** + README.md).
      e2e: ${{ github.event_name == 'pull_request' && steps.filter.outputs.e2e || 'true' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@6852f92c20ea7fd3b0c25de3b5112db3a98da050 # v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            e2e:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/e2e.yml'
              - '.github/workflows/e2e-nightly.yml'
              - '.github/workflows/e2e-baseline-bootstrap.yml'
              - '.github/workflows/e2e-baseline-update.yml'

  install-build:
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build e2e bundle (tree-shakes MSW into build-e2e/)
        working-directory: apps/web
        run: pnpm build:e2e
      - name: Upload build-e2e artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-e2e
          path: apps/web/build-e2e/
          retention-days: 1

  e2e-p0:
    needs: install-build
    runs-on: ubuntu-22.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    env:
      E2E_TARGET: local
      PW_PREVIEW_PORT: "5173"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: build-e2e
          path: apps/web/build-e2e/
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run full e2e suite
        working-directory: apps/web
        shell: bash
        run: |
          E2E_LOG="e2e-kit/playwright-report/e2e-all.log"
          mkdir -p "$(dirname "$E2E_LOG")"

          set +e
          pnpm exec playwright test --config=e2e-kit/playwright.ci.config.ts 2>&1 | tee "$E2E_LOG"
          PW_EXIT=${PIPESTATUS[0]}
          set -e

          JUNIT="e2e-kit/playwright-report/junit.xml"
          if [[ ! -f "$JUNIT" ]]; then
            echo "❌ junit.xml missing, treat as hard fail (playwright exit=$PW_EXIT)"
            exit 1
          fi
          FAILED_NAMES=$(awk '
            /<testcase / { match($0, /name="[^"]*"/); name = substr($0, RSTART+6, RLENGTH-7); has_fail=0; next }
            /<failure|<error/ { if (name && !has_fail) { print name; has_fail=1 } }
            /<\/testcase>/ { name="" }
          ' "$JUNIT")
          TOTAL_FAIL=$(echo "$FAILED_NAMES" | grep -c . || true)
          # visual vs business split 依赖 playwright junit reporter 把 test title (含 @tag) 写进 <testcase name=...>.
          # 若未来 reporter 改成不带 tag, 此 grep 将退化 (全部误判 business), 需同步改判定.
          # VISUAL_FAIL 只算 "带 @visual 且 不带 @p0" 的 fail — @p0 case 即使也带 @visual,
          # 一挂就必须 block (@p0 是硬阻断契约). 交叉 tag 走 BUSINESS 分支.
          VISUAL_FAIL=$(echo "$FAILED_NAMES" | grep "@visual" | grep -vc "@p0" || true)
          BUSINESS_FAIL=$((TOTAL_FAIL - VISUAL_FAIL))
          TOTAL_TESTS=$(grep -oE 'tests="[0-9]+"' "$JUNIT" | head -1 | grep -oE '[0-9]+' || echo 0)
          SKIPPED=$(grep -oE 'skipped="[0-9]+"' "$JUNIT" | head -1 | grep -oE '[0-9]+' || echo 0)
          PROXY_ERRORS=$(grep -c "http proxy error:" "$E2E_LOG" || true)
          echo ""
          echo "═════════════════════════════════════════════════════════════"
          echo "📊 e2e full-suite summary (playwright exit=$PW_EXIT):"
          echo "   total tests:   $TOTAL_TESTS"
          echo "   total fail:    $TOTAL_FAIL"
          echo "   business fail: $BUSINESS_FAIL"
          echo "   visual fail:   $VISUAL_FAIL"
          echo "   skipped:       $SKIPPED"
          echo "   proxy errors:  $PROXY_ERRORS"
          if [[ "$TOTAL_FAIL" -gt 0 ]]; then
            echo ""
            echo "   fail case names:"
            echo "$FAILED_NAMES" | awk '{print "     · " $0}'
          fi
          echo "═════════════════════════════════════════════════════════════"

          # 判定顺序 (fail-closed, PW_EXIT 检查在 visual allow 之前避免掩盖 crash):
          #  1. tests=0 → webServer / playwright 挂了根本没跑, block
          #  2. tests < MIN_TESTS → test discovery unexpectedly narrowed, block
          #  3. skipped>0 → 有 case 没真执行, block
          #  4. Vite proxy error → MSW 漏 mock, case 虽过也是假绿, block
          #  5. 有业务 fail (含 @p0+@visual 交叉 case) → block
          #  6. PW_EXIT!=0 但 junit 无 business fail → playwright 本身 crash/OOM/timeout, block
          #  7. 仅视觉 fail (无 @p0 交叉) 且 playwright 干净退出 → allow
          #  8. 全绿 → success
          MIN_TESTS=80
          if [[ "$TOTAL_TESTS" -eq 0 ]]; then
            echo "❌ tests=0 (playwright 没跑起 test, 通常是 preview server timeout), block PR"
            exit 1
          elif [[ "$TOTAL_TESTS" -lt "$MIN_TESTS" ]]; then
            echo "❌ tests=$TOTAL_TESTS < MIN_TESTS=$MIN_TESTS (全量 suite discovery 缩小), block PR"
            exit 1
          elif [[ "$SKIPPED" -gt 0 ]]; then
            echo "❌ skipped=$SKIPPED (有 case 没真执行), block PR"
            exit 1
          elif [[ "$PROXY_ERRORS" -gt 0 ]]; then
            echo "❌ e2e 出现 $PROXY_ERRORS 条 Vite proxy error, 说明 mock 覆盖漏网, block PR"
            grep "http proxy error:" "$E2E_LOG" | sed -E 's/.*http proxy error: //g' | sort | uniq -c
            exit 1
          elif [[ "$BUSINESS_FAIL" -gt 0 ]]; then
            echo "❌ 有 $BUSINESS_FAIL 个业务 case fail → block PR"
            exit 1
          elif [[ "$PW_EXIT" -ne 0 && "$VISUAL_FAIL" -eq 0 ]]; then
            echo "❌ playwright exit=$PW_EXIT 但 junit 无 fail 条目 (crash/OOM/timeout), block PR"
            exit 1
          elif [[ "$VISUAL_FAIL" -gt 0 && "$PW_EXIT" -ne 0 ]]; then
            echo "⚠️  仅 $VISUAL_FAIL 个视觉 case fail, playwright 非 0 退出符合预期 → allow PR (需手动更新 baseline)"
            exit 0
          elif [[ "$PW_EXIT" -ne 0 ]]; then
            echo "❌ playwright exit=$PW_EXIT 但无 visual fail 也无 business fail (异常), block PR"
            exit 1
          else
            echo "✅ all pass"
            exit 0
          fi
      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-all
          path: |
            apps/web/e2e-kit/playwright-report/
            apps/web/e2e-kit/test-results/
          retention-days: 30
